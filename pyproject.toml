[project]
name = "docxforge"
version = "0.1.0-alpha"
description = "FirstAgent: generate .docx documents from Excel data (PyQt5 GUI + CLI)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "python-docx>=1.1.0",
    "lxml>=5.0.0",
    "openpyxl>=3.1.0",
    "PyQt5==5.15.11",  # last version with win32 wheels; newer lack Windows builds
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-qt>=4.2.0",
]

[tool.uv]
# Transitive pins: newer pyqt5-qt5/sip lack win32 wheels (proven combo from working env)
constraint-dependencies = [
    "pyqt5-qt5==5.15.2",
    "pyqt5-sip==12.15.0",
]
