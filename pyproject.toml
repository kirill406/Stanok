[project]
name = "stanok"
version = "0.0.0"
description = "Десктопное приложение: заполняет docx-документы данными из Excel по docx шаблонам"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Kirill Borovoy", email = "kirillmolinillo@gmail.com" }
]
requires-python = "==3.13.*"
dependencies = [
    "PyQt5==5.15.11",
    "PyQt5-Qt5==5.15.2; sys_platform == 'win32'",
    "openpyxl>=3.1.0",
    "pydantic>=2,<3",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
stanok = "stanok.app:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "pytest>=9.1.1",
    "pyyaml>=6.0.2",
    "setuptools>=84.0.0",
    "trufflehog3>=1.1.3",
]

[tool.coverage.run]
concurrency = ["thread"]
