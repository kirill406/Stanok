[project]
name = "stanok"
version = "0.0.0"
description = "Десктопное приложение: заполняет docx-документы данными из Excel по docx шаблонам"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Kirill Borovoy", email = "kirillmolinillo@gmail.com" }
]
requires-python = "==3.13.*"
dependencies = []

[project.scripts]
stanok = "stanok.app:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
